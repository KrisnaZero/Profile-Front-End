<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.2.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <title>Input Data - LogiTrack</title>
</head>
<body>
    <!--Header-->
    <header>
        <nav>
            <div class="nav_list">
                <div class="logo"><a href="#">LogiTrack</a></div>
                <label for="check" class="checkbox">
                    <i class="ri-menu-line"></i>
                </label>
                <input type="checkbox" id="check" />
                <ul>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="input.html" class="active">Input</a></li>
                    <li><a href="about.html">About</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Main Section -->
    <main>
        <section class="section1">
            <div class="section__container form-container">
                <h1 class="title">Input <span>Data Pengiriman</span></h1>
                <p class="description">Masukkan kode pengiriman (4 digit terakhir) beserta jam masuk & keluar.</p>

                <form id="inputForm" class="input-form">
                    <div class="form-group">
                        <label>Kode (4 Digit Terakhir)</label>
                        <input type="text" id="kode" maxlength="4" placeholder="Contoh: 4821" required />
                    </div>

                    <div class="form-group">
                        <label>Jam Masuk</label>
                        <input type="time" id="jamIn" required />
                    </div>

                    <div class="form-group">
                        <label>Jam Keluar</label>
                        <input type="time" id="jamOut" required />
                    </div>

                    <button type="submit" class="submit-btn">Simpan Data</button>
                </form>

                <div class="download-section">
                    <button id="downloadExcel" class="hire__me">Download Rekap Excel</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p class="text-footer">LogiTrack © 2025</p>
    </footer>

    <!-- External JS -->
    <script src="input.js"></script>
</body>
</html>
